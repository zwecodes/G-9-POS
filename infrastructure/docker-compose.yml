# Local / VPS stack for G9POS (ARCHITECTURE.md §9).
# Usage from repo root:
#   cp infrastructure/.env.example infrastructure/.env
#   # edit JWT_SECRET and POSTGRES_PASSWORD
#   docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env up -d --build
#
# First owner (before public exposure):
#   API_URL=http://localhost:8080 OWNER_USERNAME=... OWNER_PASSWORD=... OWNER_NAME=... OWNER_PIN=1234 \
#     go run ./cmd/setupowner
#   (run from services/backend)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: g9pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/.env}
      POSTGRES_DB: g9pos
    volumes:
      - g9pos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g9pos -d g9pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://g9pos:${POSTGRES_PASSWORD}@db:5432/g9pos?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infrastructure/.env}
      SHOP_TIMEZONE: Asia/Yangon
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  g9pos_pg:
